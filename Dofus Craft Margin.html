<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dofus Craft Margin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f3ede0;--bg2:#e6dcc4;--card:rgba(255,255,255,.75);--tx:#2a2215;--mut:#7a6d54;--bd:rgba(120,95,40,.22);--gold:#b8860b;--gold2:#d9a526;--pos:#1f8a52;--neg:#c0392b;--inp:rgba(255,255,255,.8);--sh:0 8px 30px rgba(90,70,20,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12110c;--bg2:#1d1a11;--card:rgba(38,34,22,.72);--tx:#f2ead3;--mut:#a89c7d;--bd:rgba(230,185,70,.18);--gold:#e8b64a;--gold2:#ffd36b;--pos:#4fd68a;--neg:#ff7b6b;--inp:rgba(0,0,0,.28);--sh:0 10px 34px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#12110c;--bg2:#1d1a11;--card:rgba(38,34,22,.72);--tx:#f2ead3;--mut:#a89c7d;--bd:rgba(230,185,70,.18);--gold:#e8b64a;--gold2:#ffd36b;--pos:#4fd68a;--neg:#ff7b6b;--inp:rgba(0,0,0,.28);--sh:0 10px 34px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(217,165,38,.18),transparent),radial-gradient(700px 500px at -10% 30%,rgba(60,160,110,.12),transparent),var(--bg);background-attachment:fixed;color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
#root{max-width:1180px;margin:0 auto;padding:18px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-family:Cinzel,Georgia,serif;font-weight:800;font-size:1.7rem;margin:0;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em}
.tag{color:var(--mut);font-size:.85rem;margin-top:2px}
.ctrl{display:flex;gap:10px;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media(max-width:940px){.layout{grid-template-columns:1fr}}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:16px}
@media(max-width:940px){.side{position:static}}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.card h2{font-family:Cinzel,Georgia,serif;font-size:1rem;margin:0 0 12px;color:var(--gold);letter-spacing:.04em}
.recs{display:flex;flex-direction:column;gap:16px}
label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-bottom:4px;font-weight:600}
input,select{width:100%;min-width:0;padding:9px 11px;border:1px solid var(--bd);border-radius:11px;background:var(--inp);color:var(--tx);font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(217,165,38,.22)}
input[type=number]{text-align:right}
.ctrl>div{width:130px}
.rh{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.rh input{font-family:Cinzel,Georgia,serif;font-weight:600;font-size:1.1rem;background:transparent;border-color:transparent;padding-left:4px}
.rh input:hover,.rh input:focus{background:var(--inp)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.pl{display:flex;gap:6px}.pl select{width:92px;flex:none}
.ing{display:grid;grid-template-columns:minmax(0,1.5fr) 72px 70px 78px 30px;gap:8px;align-items:center;margin-bottom:6px;font-size:.9rem}
.ing.h{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:600}
.r{text-align:right;color:var(--mut);white-space:nowrap}.r b{color:var(--tx);font-weight:600}
@media(max-width:560px){.ing{grid-template-columns:minmax(0,1fr) 62px 66px 26px}.ing .u{display:none}}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--inp);color:var(--tx);border-radius:11px;padding:8px 13px;transition:transform .1s,border-color .15s}
button:hover{border-color:var(--gold2)}button:active{transform:scale(.97)}
.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;border:none;font-weight:700}
.ico{padding:5px 9px;line-height:1}.del{color:var(--neg)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:560px){.kpis{grid-template-columns:1fr}}
.kpi{border:1px solid var(--bd);border-radius:14px;padding:12px 14px;background:var(--inp)}
.kpi .l{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:600}
.kpi .v{font-size:1.55rem;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:700;background:rgba(127,127,127,.15)}
.min{margin-top:12px;font-size:.85rem;color:var(--mut);display:flex;justify-content:space-between}
details{margin-top:12px}summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:.88rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}td,th{padding:5px 2px;text-align:right}td:first-child,th:first-child{text-align:left}th{color:var(--mut);font-weight:500;font-size:.72rem}
.rk{display:flex;flex-direction:column;gap:10px}
.rk .n{display:flex;justify-content:space-between;font-size:.9rem;gap:8px}
.bar{height:7px;border-radius:9px;background:rgba(127,127,127,.18);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .3s}
.pr{display:grid;grid-template-columns:minmax(0,1fr) 86px 74px;gap:6px;align-items:center;margin-bottom:6px;font-size:.88rem}
.pr select{padding:9px 4px}
.muted{color:var(--mut);font-size:.82rem}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useEffect,useMemo}=React;
const html=htm.bind(React.createElement);
const KEY="dofus-margin-react-v3";
const keyOf=n=>(n||"").trim().toLowerCase();
const fmt=(x,d=0)=>x.toLocaleString("fr-FR",{maximumFractionDigits:d});
const K=(x,d=0)=>fmt(x,d)+" k";
const newRec=()=>({name:"Nouvelle recette",sell:0,sellLot:1,out:1,ings:[{n:"",q:1}]});
const ardonite=()=>({...newRec(),name:"Ardonite",ings:[["Fer",10],["Argent",10],["Obsidienne",10],["Bauxite",10],["Étain",5],["Cendrepierre",5],["Dolomite",5],["Silicate",5]].map(([n,q])=>({n,q}))});
function init(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.recipes&&o.recipes.length)return o}catch(e){}return{tax:2,n:100,prices:{},recipes:[ardonite()]}}

function Num({value,onChange,...p}){
  return html`<input type="number" min="0" step="any" placeholder="0" value=${value||""} onInput=${e=>onChange(parseFloat(e.target.value)||0)} ...${p}/>`;
}
function LotSel({value,onChange}){
  return html`<select value=${value||1} onChange=${e=>onChange(+e.target.value)}>${[1,10,100].map(l=>html`<option key=${l} value=${l}>${l===1?"× 1":"× "+l}</option>`)}</select>`;
}
function calc(r,prices,tax,N){
  const unit=n=>{const p=prices[keyOf(n)];return p&&p.p?p.p/(p.lot||1):0};
  const lines=r.ings.map(i=>({...i,u:unit(i.n),c:unit(i.n)*i.q}));
  const cost=lines.reduce((a,l)=>a+l.c,0);
  const out=Math.max(1,r.out||1),rev=(r.sell/(r.sellLot||1))*out;
  const m=rev*(1-tax/100)-cost;
  return{lines,cost,rev,m,pct:cost>0?m/cost*100:0,mN:m*N,out,minSell:cost/(out*(1-tax/100))};
}
function Kpi({label,cost,rev,tax,k}){
  const m=rev*(1-tax/100)-cost,pct=cost>0?m/cost*100:0,c=m>=0?"pos":"neg";
  return html`<div class="kpi"><div class="l">${label}</div>
    <div class=${"v "+c}>${m>=0?"+":""}${K(m*k)}</div>
    <div class="s"><span>Coût ${K(cost*k)}</span><span>Vente ${K(rev*k)}</span></div>
    <div class="s" style=${{marginTop:6}}><span>Taxe −${K(rev*k*tax/100)}</span><span class=${"pill "+c}>${pct>=0?"+":""}${fmt(pct,1)} %</span></div></div>`;
}
function Recipe({r,idx,S,N,upd,del,dup}){
  const c=calc(r,S.prices,S.tax,N);
  const setIng=(i,p)=>upd({ings:r.ings.map((x,j)=>j===i?{...x,...p}:x)});
  return html`<div class="card">
    <div class="rh"><input value=${r.name} onInput=${e=>upd({name:e.target.value})} aria-label="Nom"/>
      <button class="ico" title="Dupliquer" onClick=${dup}>⧉</button><button class="ico del" title="Supprimer" onClick=${del}>✕</button></div>
    <div class="f2">
      <div><label>Prix de vente</label><div class="pl"><${Num} value=${r.sell} onChange=${v=>upd({sell:v})}/><${LotSel} value=${r.sellLot} onChange=${v=>upd({sellLot:v})}/></div></div>
      <div><label>Produits par craft</label><${Num} value=${r.out} onChange=${v=>upd({out:v||1})}/></div>
    </div>
    <div class="ing h"><span>Ingrédient</span><span class="r">Qté</span><span class="r u">Prix/u</span><span class="r">Coût</span><span></span></div>
    ${c.lines.map((l,i)=>html`<div class="ing" key=${i}>
      <input list="res" placeholder="Ressource" value=${l.n} onInput=${e=>setIng(i,{n:e.target.value})}/>
      <${Num} value=${l.q} onChange=${v=>setIng(i,{q:v})}/>
      <span class="r u">${K(l.u,2)}</span><span class="r"><b>${K(l.c)}</b></span>
      <button class="ico del" onClick=${()=>upd({ings:r.ings.filter((_,j)=>j!==i)})}>✕</button></div>`)}
    <button onClick=${()=>upd({ings:[...r.ings,{n:"",q:1}]})}>+ Ingrédient</button>
    <div class="kpis"><${Kpi} label="1 craft" cost=${c.cost} rev=${c.rev} tax=${S.tax} k=${1}/><${Kpi} label=${"Lot de "+N} cost=${c.cost} rev=${c.rev} tax=${S.tax} k=${N}/></div>
    <div class="min"><span>Prix de vente minimum (unité)</span><b>${K(c.minSell,1)}</b></div>
    <details><summary>Liste d’achat pour ${N} crafts</summary>
      <table><thead><tr><th>Ressource</th><th>Quantité</th><th>Coût</th></tr></thead><tbody>
      ${c.lines.filter(l=>keyOf(l.n)).map((l,i)=>html`<tr key=${i}><td>${l.n}</td><td>${fmt(l.q*N)}</td><td>${K(l.c*N)}</td></tr>`)}
      <tr><td><b>Total</b></td><td></td><td><b>${K(c.cost*N)}</b></td></tr></tbody></table></details>
  </div>`;
}
function App(){
  const [S,setS]=useState(init);
  useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},[S]);
  const N=Math.max(1,Math.floor(S.n)||1);
  const set=p=>setS(s=>({...s,...p}));
  const updRec=i=>p=>setS(s=>({...s,recipes:s.recipes.map((r,j)=>j===i?{...r,...p}:r)}));
  const setPrice=(k,p)=>setS(s=>({...s,prices:{...s.prices,[k]:{p:0,lot:1,...s.prices[k],...p}}}));
  const used=useMemo(()=>{const m=new Map();S.recipes.forEach(r=>r.ings.forEach(i=>{const k=keyOf(i.n);if(k&&!m.has(k))m.set(k,i.n.trim())}));return[...m]},[S.recipes]);
  const rank=S.recipes.map(r=>({r,c:calc(r,S.prices,S.tax,N)})).sort((a,b)=>b.c.mN-a.c.mN);
  const mx=Math.max(1,...rank.map(x=>Math.abs(x.c.mN)));
  return html`<div>
    <div class="top"><div><h1>⚒ Dofus Craft Margin</h1><div class="tag">Calcule la rentabilité de tes crafts, à l’unité ou par lot.</div></div>
      <div class="ctrl"><div><label>Taxe HDV %</label><${Num} value=${S.tax} onChange=${v=>set({tax:v})}/></div><div><label>Crafts (lot)</label><${Num} value=${S.n} onChange=${v=>set({n:v})}/></div></div></div>
    <datalist id="res">${used.map(([k,n])=>html`<option key=${k} value=${n}/>`)}</datalist>
    <div class="layout">
      <div class="recs">
        ${S.recipes.map((r,i)=>html`<${Recipe} key=${i} r=${r} idx=${i} S=${S} N=${N} upd=${updRec(i)}
          del=${()=>confirm("Supprimer cette recette ?")&&set({recipes:S.recipes.filter((_,j)=>j!==i)})}
          dup=${()=>set({recipes:[...S.recipes.slice(0,i+1),{...JSON.parse(JSON.stringify(r)),name:r.name+" (copie)"},...S.recipes.slice(i+1)]})}/>`)}
        <button class="gold" onClick=${()=>set({recipes:[...S.recipes,newRec()]})}>+ Nouvelle recette</button>
      </div>
      <div class="side">
        <div class="card"><h2>Classement · lot de ${N}</h2><div class="rk">
          ${rank.map(({r,c},i)=>html`<div key=${i}><div class="n"><span>${i===0&&c.mN>0?"👑 ":""}${r.name}</span><b class=${c.mN>=0?"pos":"neg"}>${c.mN>=0?"+":""}${K(c.mN)}</b></div>
            <div class="bar"><i style=${{width:Math.abs(c.mN)/mx*100+"%",background:c.mN>=0?"var(--pos)":"var(--neg)"}}></i></div></div>`)}</div></div>
        <div class="card"><h2>Prix des ressources</h2>
          <div class="muted" style=${{marginBottom:10}}>Un seul prix par ressource, partagé entre toutes les recettes.</div>
          ${used.length?used.map(([k,n])=>{const p=S.prices[k]||{p:0,lot:1};return html`<div class="pr" key=${k}><span>${n}</span>
            <${Num} value=${p.p} onChange=${v=>setPrice(k,{p:v})}/><${LotSel} value=${p.lot} onChange=${v=>setPrice(k,{lot:v})}/></div>`}):html`<div class="muted">Ajoute des ingrédients.</div>`}
          <button style=${{marginTop:6}} onClick=${()=>set({prices:{}})}>Remettre à zéro</button></div>
      </div>
    </div>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
